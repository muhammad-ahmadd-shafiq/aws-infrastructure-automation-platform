name: CloudOps Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/muhammad-ahmadd-shafiq/cloudops-dashboard

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker pull ${{ env.IMAGE_NAME }}:latest

            docker stop cloudops-dashboard || true
            docker rm cloudops-dashboard || true

            docker run -d \
              --name cloudops-dashboard \
              --restart always \
              -p 80:5000 \
              -e APP_VERSION=${{ github.sha }} \
              -e BUILD_NUMBER=${{ github.run_number }} \
              ${{ env.IMAGE_NAME }}:latest