---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install Docker
  ansible.builtin.apt:
    name: docker.io
    state: present

- name: Enable Docker service
  ansible.builtin.service:
    name: docker
    enabled: true

- name: Start Docker service
  ansible.builtin.service:
    name: docker
    state: started

- name: Add ubuntu user to docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true
